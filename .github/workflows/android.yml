name: Android app

# Builds the Spotter Android app (web app + Health Connect) and publishes the
# APK as the "android-latest" release, so it can be downloaded on the phone.
on:
  push:
    paths:
      - "android/**"
      - "index.html"
      - "vendor/**"
      - "icons/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show available Health Connect library versions
        run: curl -sL https://dl.google.com/dl/android/maven2/androidx/health/connect/connect-client/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -6 || true

      - name: Bundle the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp -r vendor icons android/app/src/main/assets/

      - name: Install Gradle
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Use the permanent signing key from repository secrets
        env:
          KEYSTORE_B64: ${{ secrets.SPOTTER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SPOTTER_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with your permanent key: installs as an update over earlier builds." >> "$GITHUB_ENV"
          else
            echo "::warning::SPOTTER_KEYSTORE_B64 secret not set; signing with a temporary key. Each build must be installed fresh."
            echo "SIGNING_NOTE=Signed with a temporary key: uninstall the previous build first (export a backup in Profile before you do)." >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          SPOTTER_KEYSTORE_PASSWORD: ${{ secrets.SPOTTER_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/spotter.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: spotter-apk
          path: ${{ runner.temp }}/spotter.apk

      - name: Publish as the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "$RUNNER_TEMP/spotter.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Spotter for Android (build ${{ github.run_number }})" \
            --notes "Latest Spotter Android app with Pixel Watch / Health Connect support. On your phone, download spotter.apk below and open it to install. $SIGNING_NOTE"
