<meta name="theme-color" content="#0e1217" media="(prefers-color-scheme: dark)">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Spotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed bottom tab bar. Steel neutrals, competition-plate colours as the only accents. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #141a22;
  --muted: #5b6675;
  --line: #d6dce4;
  --accent: #1f57c3;
  --accent-soft: #e3ebfa;
  --on-accent: #ffffff;
  --plate-red: #cf3a2e;
  --plate-blue: #1f57c3;
  --plate-yellow: #d9a300;
  --plate-green: #2c8f4d;
  --plate-white: #e9edf1;
  --good: #2c8f4d;
  --warn: #b97800;
  --bad: #c0392b;
  --shadow: 0 1px 2px rgba(20,26,34,.06), 0 4px 14px rgba(20,26,34,.05);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 12px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1217; --surface: #161b22; --surface-2: #1c222b; --ink: #e6ebf1; --muted: #93a0b0;
    --line: #2a323d; --accent: #6a96ff; --accent-soft: #1b2740; --on-accent: #0b1020;
    --plate-red: #e5574a; --plate-blue: #5b8cff; --plate-yellow: #e9b726; --plate-green: #44b46a; --plate-white: #c9d1da;
    --good: #44b46a; --warn: #e0a42a; --bad: #ef6a5c;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1217; --surface: #161b22; --surface-2: #1c222b; --ink: #e6ebf1; --muted: #93a0b0;
  --line: #2a323d; --accent: #6a96ff; --accent-soft: #1b2740; --on-accent: #0b1020;
  --plate-red: #e5574a; --plate-blue: #5b8cff; --plate-yellow: #e9b726; --plate-green: #44b46a; --plate-white: #c9d1da;
  --good: #44b46a; --warn: #e0a42a; --bad: #ef6a5c;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 30px; text-transform: uppercase; }
h2 { font-size: 22px; text-transform: uppercase; }
h3 { font-size: 18px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.brand svg { width: 26px; height: 26px; }
.sync { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--good); } .dot.warn { background: var(--warn); }

main { padding-block: 16px calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; background: var(--surface-2); }
.hero-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.hero-card .bar { height: 6px; display: flex; }
.hero-card .bar i { flex: 1; }
.hero-card .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; font-weight: 600; min-height: 44px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-weight: 700; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.good { color: var(--good); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; }
input[type=text], input[type=number], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
textarea { resize: vertical; min-height: 80px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .grid2 { grid-template-columns: 1fr; } }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: inline-block; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 14px; }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Exercise list in plans */
.ex-list { display: flex; flex-direction: column; }
.ex-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline; }
.ex-row:first-child { border-top: 0; }
.ex-row .meta { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.ex-row b { font-weight: 600; }

/* Live workout */
.ex-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.ex-card.done { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.ex-head { display: flex; gap: 8px; align-items: flex-start; }
.ex-head h3 { flex: 1; min-width: 0; }
.tip { font-size: 13px; background: var(--accent-soft); color: var(--ink); padding: 8px 10px; border-radius: 8px; }
.tip b { color: var(--accent); }
.sets { display: grid; grid-template-columns: 26px minmax(0,1fr) minmax(0,1fr) 64px 44px; gap: 6px; align-items: center; }
.sets .h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; }
.sets .n { text-align: center; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.sets input, .sets select { text-align: center; padding: 8px 4px; min-height: 42px; font-variant-numeric: tabular-nums; }
.sets select { padding: 8px 2px; }
.tick { width: 44px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.tick svg { width: 20px; height: 20px; stroke: var(--muted); }
.tick.on { background: var(--good); border-color: var(--good); }
.tick.on svg { stroke: #fff; }
.plates { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.plate { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 4px; font-weight: 700; font-size: 11px; color: #fff; font-variant-numeric: tabular-nums; }
.p25 { background: var(--plate-red); } .p20 { background: var(--plate-blue); } .p15 { background: var(--plate-yellow); color: #1a1a1a; }
.p10 { background: var(--plate-green); } .p5 { background: var(--plate-white); color: #1a1a1a; } .psm { background: var(--muted); }

.restbar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); z-index: 8; }
.restbar .wrap { padding-block: 8px; }
.restbar .inner { background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.restbar .t { font-family: var(--font-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 64px; }
.restbar button { background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.restbar .prog { flex: 1; height: 4px; background: color-mix(in srgb, var(--bg) 25%, transparent); border-radius: 2px; overflow: hidden; }
.restbar .prog i { display: block; height: 100%; background: var(--plate-yellow); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); padding-left: 4px; padding-right: 4px; }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); }
nav.tabs svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.stat b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.stat span { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

.vol { display: flex; flex-direction: column; gap: 6px; }
.vol-row { display: grid; grid-template-columns: 90px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; }
.vol-row .track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.vol-row .track i { display: block; height: 100%; background: var(--accent); }

details.hist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.hist summary { list-style: none; padding: 12px 14px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
details.hist summary::-webkit-details-marker { display: none; }
details.hist .date { width: 46px; text-align: center; flex: none; }
details.hist .date b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1; }
details.hist .date span { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
details.hist .content { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.hist-ex { font-size: 14px; }
.hist-ex .sets-line { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

.chart-box { overflow-x: auto; }
.chart-box svg { display: block; width: 100%; height: auto; }
.pr-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.pr-table td { padding: 6px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.pr-table td:last-child { text-align: right; }

/* Coach chat */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; min-width: 0; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.assistant strong { font-weight: 700; }
.composer { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); z-index: 8; background: var(--bg); border-top: 1px solid var(--line); }
.composer .wrap { display: flex; gap: 8px; padding-block: 8px; }
.composer textarea { min-height: 44px; height: 44px; max-height: 140px; }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; }
.suggest button { font-size: 13px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }

.banner { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
.empty { text-align: center; padding: 24px 12px; color: var(--muted); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--line); }
.day-pick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.day-pick button { flex: none; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="9" width="4" height="14" rx="1" fill="var(--plate-red)"/><rect x="7" y="6" width="4" height="20" rx="1" fill="var(--plate-blue)"/><rect x="11" y="14.5" width="10" height="3" fill="var(--muted)"/><rect x="21" y="6" width="4" height="20" rx="1" fill="var(--plate-blue)"/><rect x="26" y="9" width="4" height="14" rx="1" fill="var(--plate-red)"/></svg>
      Spotter
    </div>
    <div class="sync" id="sync"><i class="dot"></i><span>Loading…</span></div>
  </div>
</header>

<main><div class="wrap" id="app"><div class="empty">Loading your training log…</div></div></main>

<div class="restbar" id="restbar" hidden></div>
<div class="composer" id="composer" hidden></div>
<div class="toast" id="toast" hidden></div>

<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Train</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</button>
    <button data-tab="coach"><svg viewBox="0 0 24 24"><path d="M5 18l-1 3 4-2h9a3 3 0 003-3V7a3 3 0 00-3-3H7a3 3 0 00-3 3v9"/><path d="M9 10h6M9 13h4"/></svg>Coach</button>
    <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>Progress</button>
    <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>Profile</button>
  </div>
</nav>

/* Session templates: [pattern, variant] — first two slots are main lifts */

  FB_C: ["Full Body C", [["squat",1],["hpush",1],["hpull",1],["ham",0],["calf",0],["core",1]]],
  UP_A: ["Upper A", [["hpush",0],["hpull",0],["vpush",0],["vpull",0],["tricep",0],["bicep",0]]],
  LO_A: ["Lower A", [["squat",0],["hinge",1],["lunge",0],["ham",0],["calf",0],["core",0]]],
  UP_B: ["Upper B", [["vpush",0],["vpull",1],["hpush",1],["hpull",1],["delt",0],["chestiso",0]]],
  LO_B: ["Lower B", [["hinge",0],["squat",2],["quad",0],["ham",1],["calf",0],["core",1]]],
  PUSH: ["Push", [["hpush",0],["vpush",0],["hpush",1],["delt",0],["tricep",0],["chestiso",0]]],
  PULL: ["Pull", [["vpull",0],["hpull",0],["hpull",1],["delt",1],["bicep",0],["bicep",2]]],

function splitFor(days, level) {

  if (days === 4) return ["UP_A","LO_A","UP_B","LO_B"];

function pickExercise(pattern, variant, equipKey, used) {

  if (!opts.length) return null;
  for (let k = 0; k < opts.length; k++) {
    const e = opts[(variant + k) % opts.length];

/* =========================================================
   Built-in programming engine (works offline, no AI needed)
   ========================================================= */
function buildPlan(profile) {
  const days = Math.max(1, Math.min(6, +profile.days || 3));
  const g = GOALS[profile.goal] || GOALS.general;
  const split = splitFor(days, profile.level).slice(0, Math.max(days, 2));
  const minutes = +profile.minutes || 60;
  const planDays = split.map((key, di) => {
    const [name, slots] = T[key];
    const used = new Set();
    let exercises = [];
    slots.forEach(([pattern, variant], i) => {
      // later repeats of the same split day get alternate variants
      const v = variant + (split.indexOf(key) !== di ? 1 : 0);
      const e = pickExercise(pattern, v, profile.equipment, used);
      if (!e) return;
      used.add(e.name);
      let [sets, lo, hi, rest] = (i < 2 && e.kind === "c") ? g.main : g.acc;
      if (profile.level === "beginner" && i < 2) sets = Math.max(3, sets - 1);
      if (profile.level === "advanced" && i >= 2) sets += 1;
      if (e.kind === "t") { lo = pattern === "core" ? 30 : 30; hi = pattern === "core" ? 60 : 45; rest = 60; }
      if (e.equip === "bodyweight" && e.kind !== "t" && i < 2) { lo = Math.max(lo, 6); hi = Math.max(hi, 12); }
      exercises.push({ name: e.name, sets, repLow: lo, repHigh: hi, rest });
    });
    if (g.cardio) {
      const c = pickExercise("cardio", di, profile.equipment, used);
      if (c) exercises.push({ name: c.name, sets: 1, repLow: g.cardio[1] * 60, repHigh: g.cardio[2] * 60, rest: 0, notes: "Finisher — steady hard effort or 30s on / 30s off" });
    }
    // trim to fit the time budget (keep at least 3)
    const est = list => list.reduce((s, x) => s + x.sets * ((x.rest || 60) + (exInfo(x.name).kind === "t" ? Math.min(x.repHigh, 600) : 40)), 0) / 60 + 8;
    while (exercises.length > 3 && est(exercises) > minutes) {
      const cardioIdx = exercises.findIndex(x => exInfo(x.name).pattern === "cardio");
      exercises.splice(cardioIdx === exercises.length - 1 && exercises.length > 4 ? exercises.length - 2 : exercises.length - 1, 1);
    }
    return { name, focus: focusOf(exercises), exercises };
  });

    name: `${g.label} · ${days} day${days > 1 ? "s" : ""}/week`,
    source: "engine", createdAt: new Date().toISOString(),
    rationale: `Built from your goal (${g.label.toLowerCase()}), ${LEVELS[profile.level] ? profile.level : "your"} experience, ${EQUIP_LABELS[profile.equipment] || "your equipment"} and about ${minutes} minutes a session. Weights progress automatically with double progression: hit the top of the rep range on every set and the load goes up next time.`,
    days: planDays,

}
function focusOf(exercises) {
  const m = [];
  exercises.forEach(x => { const mu = exInfo(x.name).muscle; if (mu !== "Conditioning" && !m.includes(mu)) m.push(mu); });
  return m.slice(0, 4).join(" · ");
}

/* Units: everything is stored in kg; converted on display */

    .sort((a, b) => b.date.localeCompare(a.date))
    .map(w => ({ date: w.date, sets: w.exercises.filter(e => e.name.toLowerCase() === n).flatMap(e => e.sets).filter(s => s.done !== false && +s.r > 0) }))

function suggest(target) {

  if (!hist.length) {
    if (timed) return { weight: null, reps: lo, note: `First time: aim for ${fmtSecs(lo)} per set at a steady effort.` };
    if (!info.inc) return { weight: null, reps: lo, note: `First time: do ${lo}–${hi} clean reps per set and log what you get.` };
    if (target.weight) return { weight: target.weight, reps: lo, note: `Suggested starting load. Adjust if it doesn't feel like ${lo}–${hi} reps with 2 in the tank.` };
    return { weight: null, reps: lo, note: `First time: pick a weight you could lift for about ${hi + 2} reps, stop each set with 2 reps left, and log it. I'll set the load from here on.` };
  }
  const last = hist[0];
  const top = topSet(last.sets);

  const rpes = last.sets.map(s => +s.rpe).filter(Boolean);
  const hardRpe = rpes.length && Math.max(...rpes) >= 9.5;
  const lastStr = last.sets.map(s => (s.w ? `${fmtW(+s.w)}×${s.r}` : timed ? fmtSecs(s.r) : `${s.r}`)).join(", ");

  const recent = hist.slice(0, 4).map(h => topSet(h.sets));
  const stalled = recent.length >= 4 && recent.every(t => t.w === recent[0].w && t.r <= recent[recent.length - 1].r);

  if (timed) {
    const best = Math.max(...last.sets.map(s => +s.r));
    const all = last.sets.every(s => +s.r >= hi);
    return all ? { weight: null, reps: Math.round(hi + 10), note: `Last time ${lastStr}. You held the full ${fmtSecs(hi)} on every set, so add about 10s.` }

  }
  if (!info.inc || !top.w) {
    const best = Math.max(...last.sets.map(s => +s.r));
    const all = last.sets.length >= (+target.sets || 1) && last.sets.every(s => +s.r >= hi);
    return all ? { weight: null, reps: hi + 1, note: `Last time ${lastStr}. Every set hit ${hi}+, so push for ${hi + 1}. Add a weight vest or a harder variation once ${hi + 3} feels easy.` }
               : { weight: null, reps: Math.min(hi, best + 1), note: `Last time ${lastStr}. Aim for ${Math.min(hi, best + 1)} reps on each set.` };
  }
  const inc = incFor(info);
  const allHit = atTop.length >= Math.min(+target.sets || 3, last.sets.length) && atTop.every(s => +s.r >= hi);
  const missed = last.sets.filter(s => +s.r < lo).length;
  if (allHit && !hardRpe) {
    const w = roundLoad(top.w + inc, info);
    return { weight: w, reps: lo, note: `Last time ${lastStr}. You hit ${hi} on every set, so the load goes up to ${fmtW(w)} ${unit()}. Start at ${lo} reps and build back up.`, up: true };
  }
  if (missed >= 2) {
    const prev = hist[1] && topSet(hist[1].sets);
    const prevMissed = hist[1] && prev.w === top.w && hist[1].sets.filter(s => +s.r < lo).length >= 2;
    if (prevMissed || stalled) {

    }
    return { weight: top.w, reps: lo, note: `Last time ${lastStr}, which is below the ${lo}-rep floor. Stay at ${fmtW(top.w)} ${unit()} and get at least ${lo} on every set.` };

  const goal = Math.min(hi, minR + 1);
  return { weight: top.w, reps: goal, note: `Last time ${lastStr}. Same load, aim for ${goal}+ reps on every set.${stalled ? " This lift has stalled for 4 sessions; ask the Coach about a variation swap." : ""}`, stalled };
}

/* Plates per side for barbell lifts */
function plateMath(kg) {
  if (!kg) return null;
  const lb = unit() === "lb";
  const total = lb ? kg * KG_LB : kg, bar = lb ? 45 : 20;
  let side = (total - bar) / 2;
  if (side < 0) return null;
  const set = lb ? [45, 35, 25, 10, 5, 2.5] : [25, 20, 15, 10, 5, 2.5, 1.25];
  const cls = lb ? { 45: "p25", 35: "p20", 25: "p15", 10: "p10", 5: "p5" } : { 25: "p25", 20: "p20", 15: "p15", 10: "p10", 5: "p5" };
  const out = [];
  for (const p of set) { while (side >= p - 0.001) { out.push([p, cls[p] || "psm"]); side -= p; } }
  return { bar, out, rem: side };
}

/* Training analysis used by both the UI and the AI coach */
function weekKey(d) { const t = new Date(d); const day = (t.getDay() + 6) % 7; t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - day); return t.toISOString().slice(0, 10); }
function weeklySets(days = 7) {
  const since = Date.now() - days * 864e5;
  const out = {};
  state.workouts.filter(w => new Date(w.date).getTime() >= since).forEach(w => w.exercises.forEach(e => {
    const m = exInfo(e.name).muscle; const n = e.sets.filter(s => s.done !== false && +s.r > 0).length;
    if (n) out[m] = (out[m] || 0) + n;

}

  const since = Date.now() - hours * 36e5;
  const m = new Set();
  state.workouts.filter(w => new Date(w.date).getTime() >= since).forEach(w => w.exercises.forEach(e => m.add(exInfo(e.name).muscle)));
  m.delete("Conditioning");

}
function nextPlanDay() {
  const plan = state.plan; if (!plan?.days?.length) return 0;
  const last = [...state.workouts].sort((a, b) => b.date.localeCompare(a.date)).find(w => w.planDay != null && w.planName === plan.name);
  return last ? (last.planDay + 1) % plan.days.length : 0;
}

  const prs = {};
  state.workouts.forEach(w => w.exercises.forEach(e => e.sets.forEach(s => {
    if (s.done === false || !(+s.r > 0)) return;
    const info = exInfo(e.name); const key = info.name || e.name;

  const u = unit();
  const lines = [];
  lines.push(`ATHLETE: ${p.name || "Unnamed"}; goal=${GOALS[p.goal]?.label || p.goal}; level=${p.level}; trains ${p.days} days/week; ~${p.minutes} min/session; equipment=${EQUIP_LABELS[p.equipment] || p.equipment}; units=${u}${p.bodyweight ? `; bodyweight=${fmtW(+p.bodyweight)}${u}` : ""}${p.age ? `; age=${p.age}` : ""}${p.sex ? `; sex=${p.sex}` : ""}.`);
  if (p.notes) lines.push(`ATHLETE NOTES (injuries, preferences): ${p.notes}`);
  if (state.plan) {
    lines.push(`CURRENT PLAN "${state.plan.name}" (${state.plan.source === "ai" ? "made by coach" : "auto-generated"}):`);
    state.plan.days.forEach((d, i) => lines.push(`  Day ${i + 1} ${d.name}: ${d.exercises.map(x => `${x.name} ${x.sets}x${x.repLow}-${x.repHigh}`).join("; ")}`));
  }
  const ws = state.workouts.slice().sort((a, b) => b.date.localeCompare(a.date));
  lines.push(`TOTAL SESSIONS LOGGED: ${ws.length}${ws.length ? ` (first ${ws[ws.length - 1].date.slice(0, 10)})` : ""}. Today is ${new Date().toISOString().slice(0, 10)}.`);
  const wk = {}; ws.forEach(w => { const k = weekKey(w.date); wk[k] = (wk[k] || 0) + 1; });
  const weeks = Object.entries(wk).slice(0, 8);
  if (weeks.length) lines.push(`SESSIONS PER WEEK (recent first): ${weeks.map(([k, n]) => `${k}:${n}`).join(", ")}`);
  const vol = weeklySets(7);
  if (Object.keys(vol).length) lines.push(`HARD SETS LAST 7 DAYS BY MUSCLE: ${Object.entries(vol).map(([m, n]) => `${m} ${n}`).join(", ")}`);
  // per-exercise trends (all-time, compact)
  const names = new Set(); ws.forEach(w => w.exercises.forEach(e => names.add(e.name)));
  const trend = [];
  names.forEach(n => {
    const h = sessionsWith(n); if (!h.length) return;
    const pts = h.slice(0, 5).map(x => { const t = topSet(x.sets); return `${x.date.slice(5, 10)} ${t.w ? fmtW(t.w) + "x" : ""}${t.r}`; });
    const best = h.reduce((b, x) => Math.max(b, ...x.sets.map(s => e1rm(+s.w || 0, +s.r))), 0);
    trend.push(`  ${n} (${h.length} sessions${best ? `, best e1RM ${fmtW(best)}${u}` : ""}): ${pts.join(" | ")}`);
  });
  if (trend.length) { lines.push("EXERCISE HISTORY (top set per session, newest first):"); lines.push(...trend.slice(0, 60)); }
  if (ws.length) {
    lines.push("LAST SESSIONS IN DETAIL:");
    ws.slice(0, 8).forEach(w => {
      lines.push(`  ${w.date.slice(0, 10)} ${w.title || ""}${w.durationMin ? ` (${w.durationMin} min)` : ""}${w.feel ? ` felt ${w.feel}/5` : ""}${w.notes ? ` — note: ${w.notes}` : ""}`);
      w.exercises.forEach(e => {
        const s = e.sets.filter(x => x.done !== false && +x.r > 0).map(x => `${x.w ? fmtW(+x.w) + "x" : ""}${x.r}${x.rpe ? "@" + x.rpe : ""}`).join(", ");
        if (s) lines.push(`    ${e.name}: ${s}`);

    });
  }
  return lines.join("\n");
}

  state.tab = (location.hash || "").slice(1) || "today";

  if (hasClaude) {
    try { sample = await window.claude.use("sample"); } catch {}
    try { downloads = await window.claude.use("downloads"); } catch {}
    state.ai = !!sample;
    try {
      const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (d && u) { uid = await u.id(); if (uid) db = d; }
    } catch {}

        db.doc(base() + "/profile").get(), db.doc(base() + "/plan").get(), db.doc(base() + "/coach").get(),
        db.doc(base() + "/active").get(), wcol().orderBy("date", "desc").limit(1000).get(),
      ]), 12000);

        state.cloud = true; saveProfile(); savePlan(); saveChat(); state.workouts.forEach(saveWorkout);
      } else {
        if (p.exists) state.profile = p.data().profile || null;

        if (c.exists) state.chat = c.data().chat || [];
        if (a.exists) state.active = a.data().active || null;
        const cloudW = ws.docs.map(d => d.data());
        const ids = new Set(cloudW.map(w => w.id));
        const localOnly = state.workouts.filter(w => !ids.has(w.id) && cached);

        localOnly.forEach(saveWorkout);

}

${trainingSummary()}
=== END DATA ===

Write this athlete a new weekly training programme with exactly ${p.days} training days, each fitting about ${p.minutes} minutes, using only equipment available to them (${EQUIP_LABELS[p.equipment]}). Respect injuries/notes. Use their history: keep lifts that are progressing, swap or vary lifts that have stalled, balance weekly volume across muscles, and match rep ranges to the goal.${req ? `\nAthlete requests: ${req}` : ""}

Reply with ONLY a JSON object, no prose, in this shape:
{"name": short programme name, "rationale": 2-3 sentences explaining the choices with reference to their data, "days": [{"name": short day name, "focus": short muscle focus, "exercises": [${exerciseSchemaText(u)}]}]}`;
  try {
    const out = await sample.json(prompt, { modelTier: "default" });
    const days = (out?.days || []).map(d => ({ name: String(d.name || "Day").slice(0, 40), focus: String(d.focus || "").slice(0, 80), exercises: normExercises(d.exercises) })).filter(d => d.exercises.length);
    if (!days.length) throw { code: "invalid_json" };
    days.forEach(d => d.exercises.forEach(x => delete x.weight));
    state.plan = { name: String(out.name || "Coach plan").slice(0, 60), rationale: String(out.rationale || "").slice(0, 600), source: "ai", createdAt: new Date().toISOString(), days };
    ui.planDay = null; savePlan(); toast("New plan saved");
  } catch (e) { ui.aiError = aiErr(e); }
  ui.aiBusy = false; render();
}
async function aiSession() {
  if (!sample || ui.aiBusy) return;
  ui.todayNote = document.getElementById("today-note")?.value.trim() || "";
  ui.aiBusy = true; ui.aiError = ""; render();
  const u = unit(), p = state.profile;
  const mins = ui.timeAvail || p.minutes;
  const nd = state.plan?.days?.[nextPlanDay()];
  const feelWords = ["", "wrecked", "low energy", "normal", "good", "great"][ui.feel];
  const prompt = `${coachRules()}

=== ATHLETE DATA ===
${trainingSummary()}
Muscles trained in the last 48h: ${recentlyWorked(48).join(", ") || "none"}.
Next scheduled plan day: ${nd ? `${nd.name} (${nd.exercises.map(x => x.name).join(", ")})` : "none"}.
=== END DATA ===

Today the athlete feels ${feelWords} and has ${mins} minutes.${ui.todayNote ? ` They add: "${ui.todayNote}".` : ""}
Write today's session. Prefer the scheduled day unless recovery, energy, time or their note says otherwise. Use only their equipment (${EQUIP_LABELS[p.equipment]}). Set "weight" for each loaded exercise from their history using progressive overload (lower it when energy is low); null when there's no history. Fit the time including rest.

Reply with ONLY a JSON object: {"title": short session title, "rationale": 1-2 sentences on why this session today, "exercises": [${exerciseSchemaText(u)}]}`;
  try {
    const out = await sample.json(prompt, { modelTier: "default" });
    const ex = normExercises(out?.exercises);
    if (!ex.length) throw { code: "invalid_json" };
    ui.aiBusy = false;
    startWorkout(String(out.title || "Coach session").slice(0, 50), ex, { rationale: String(out.rationale || "").slice(0, 300), source: "ai" });
    // AI-specified weights override the engine's suggestion
    state.active.exercises.forEach((e, i) => { if (ex[i].weight != null) { e.sets.forEach(s => s.w = roundLoad(ex[i].weight, exInfo(e.name))); e.tip = (ex[i].notes ? ex[i].notes + " " : "") + `Coach set ${fmtW(e.sets[0].w)} ${u} for today.`; } });
    saveActive(0); render();
    return;
  } catch (e) { ui.aiError = aiErr(e); }
  ui.aiBusy = false; render();
}

/* ---------- Profile ---------- */
function viewProfile() {
  return `<div class="view">
    <div class="stack"><p class="label">Profile</p><h1>About you</h1><p class="small muted">Changing your goal, days or equipment offers to rebuild your plan. Your history is never lost.</p></div>
    <div class="card">${profileForm(state.profile, "Save profile")}</div>
    ${ui.confirm === "rebuild-after-save" ? `<div class="confirm"><span class="small">Your training setup changed. Rebuild your plan to match?</span><button class="btn sm primary" data-action="gen-plan">Rebuild plan</button><button class="btn sm" data-action="cancel">Keep current plan</button></div>` : ""}
    ${STANDALONE ? `<div class="card stack" id="ai-key-card">
      <div><p class="label">AI coach</p><h3>Connect your Anthropic API key</h3></div>
      <p class="small muted">The installed app talks to Claude directly using your own API key from console.anthropic.com. Usage is billed to your Anthropic account; a coach reply typically costs a few cents. The key is stored only on this phone.</p>
      ${getApiKey() ? `<div class="row"><span class="chip good">Key saved · ends ${esc(getApiKey().slice(-4))}</span><button class="btn sm ghost danger" data-action="key-remove">Remove key</button></div>`
        : `<label class="field"><span>API key</span><input type="password" id="api-key" autocomplete="off" spellcheck="false" placeholder="sk-ant-…"></label><button class="btn sm primary" data-action="key-save" style="align-self:flex-start">Save key</button>`}
    </div>` : ""}
    <div class="card stack">
      <div><p class="label">Your data</p><h3>Storage & backup</h3></div>
      <p class="small muted">${state.cloud ? "Your workouts, plan and coach chat are saved privately to your claude.ai account, so they're there on any device you open Spotter on." : STANDALONE ? "Your data is saved on this phone. Export a backup now and then; you can import it on another phone or into Spotter on claude.ai." : "Your data is saved in this browser only. Export a backup now and then so you never lose it."} ${state.workouts.length} sessions stored.</p>
      <div class="row"><button class="btn sm" data-action="export">Export backup</button><label class="btn sm" for="import-file">Import backup</label><input type="file" id="import-file" accept="application/json,.json" hidden></div>
      <textarea id="export-box" hidden readonly></textarea>
      ${ui.confirm === "reset" ? `<div class="confirm"><span class="small">Erase every workout, your plan and your profile? This can't be undone.</span><button class="btn sm danger" data-action="reset-yes">Erase everything</button><button class="btn sm" data-action="cancel">Cancel</button></div>` : `<button class="btn sm ghost danger" data-action="reset" style="align-self:flex-start">Erase all data</button>`}
    </div>
  </div>`;
}
async function doExport() {
  const data = JSON.stringify({ app: "spotter", version: 1, exportedAt: new Date().toISOString(), profile: state.profile, plan: state.plan, workouts: state.workouts }, null, 1);
  const filename = `spotter-backup-${new Date().toISOString().slice(0, 10)}.json`;
  if (downloads) { try { await downloads.save({ filename, data }); toast("Backup saved"); return; } catch (e) { if (e?.code === "declined" || e?.code === "cancelled") return; } }
  if (STANDALONE) {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000); toast("Backup downloaded"); return;
    } catch {}
  }
  const box = document.getElementById("export-box"); box.hidden = false; box.value = data; box.select();
  try { await navigator.clipboard.writeText(data); toast("Backup copied to clipboard"); } catch { toast("Copy the backup text below"); }
}
function doImport(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.workouts)) throw 0;
      const ids = new Set(state.workouts.map(w => w.id));
      const add = d.workouts.filter(w => w && w.id && w.date && Array.isArray(w.exercises) && !ids.has(w.id));
      state.workouts.push(...add); add.forEach(saveWorkout);
      if (d.profile && !state.profile) { state.profile = d.profile; saveProfile(); }
      if (d.plan && !state.plan) { state.plan = d.plan; savePlan(); }
      toast(`Imported ${add.length} workout${add.length === 1 ? "" : "s"}`); render();
    } catch { toast("That file isn't a Spotter backup"); }
  };
  r.readAsText(file);
}
async function resetAll() {
  const ids = state.workouts.map(w => w.id);
  state.profile = null; state.plan = null; state.workouts = []; state.chat = []; state.active = null; ui.confirm = null;
  try { localStorage.removeItem(LS_KEY); } catch {}
  if (db) {
    try {
      for (const id of ids) await wcol().doc(id).delete();
      for (const k of ["profile", "plan", "coach", "active"]) await db.doc(base() + "/" + k).delete();
    } catch (e) { console.warn(e); }
  }
  setTab("today");
}

/* =========================================================
   Events
   ========================================================= */
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
document.addEventListener("submit", e => {
  if (e.target.id !== "profile-form") return;
  e.preventDefault();
  const old = state.profile;
  const p = readProfileForm(e.target);
  state.profile = { ...(old || {}), ...p, createdAt: old?.createdAt || new Date().toISOString() };
  saveProfile();
  if (!old) { state.plan = buildPlan(state.profile); savePlan(); setTab("today"); toast("Your plan is ready"); return; }
  const changed = ["goal", "level", "days", "minutes", "equipment"].some(k => String(old[k]) !== String(p[k]));
  ui.confirm = changed ? "rebuild-after-save" : null;
  toast("Profile saved"); render();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "feel") ui.feel = +t.value;
  if (t.name === "tavail") ui.timeAvail = +t.value;
  if (t.name === "wfeel" && state.active) { state.active.feel = +t.value; saveActive(); }
  if (t.id === "hist-ex") { ui.histEx = t.value; render(); }
  if (t.id === "import-file" && t.files[0]) doImport(t.files[0]);
  if (t.dataset.action === "swap" && t.value && state.active) {
    const i = +t.dataset.ex, e0 = state.active.exercises[i];
    const s = suggest({ ...e0.target, name: t.value });
    state.active.exercises[i] = { ...e0, name: t.value, tip: s.note, sets: e0.sets.map(x => ({ ...x, w: s.weight, r: s.reps || x.r, done: false })) };
    saveActive(0); render();
  }
  if (t.dataset.f === "rpe" && state.active) { state.active.exercises[+t.dataset.ex].sets[+t.dataset.set].rpe = t.value; saveActive(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (!state.active) return;
  if (t.dataset.f === "w" || t.dataset.f === "r") {
    const ex = state.active.exercises[+t.dataset.ex], s = ex.sets[+t.dataset.set];
    if (t.dataset.f === "w") {
      s.w = fromDisp(t.value);
      // carry the new weight to later unticked sets
      ex.sets.slice(+t.dataset.set + 1).forEach((x, k) => { if (!x.done) { x.w = s.w; const el = document.getElementById(`w-${t.dataset.ex}-${+t.dataset.set + 1 + k}`); if (el) el.value = t.value; } });
    } else s.r = t.value === "" ? "" : +t.value;
    saveActive();
  }
  if (t.id === "w-notes") { state.active.notes = t.value; saveActive(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b || b.tagName === "SELECT") return;
  const a = b.dataset.action, A = state.active;
  switch (a) {
    case "pick-day": ui.planDay = +b.dataset.i; render(); break;
    case "start-plan": { const i = +b.dataset.i, d = state.plan.days[i]; if (A) { setTab("today"); toast("Finish or discard your current workout first"); break; } state.tab = "today"; try { history.replaceState(null, "", "#today"); } catch {} startWorkout(d.name, d.exercises, { planName: state.plan.name, planDay: i, source: "plan" }); break; }
    case "start-empty": startWorkout("Workout", []); break;
    case "gen-plan": state.plan = buildPlan(state.profile); ui.confirm = null; ui.planDay = null; savePlan(); toast("Plan rebuilt"); render(); break;
    case "ask-regen": ui.confirm = "regen"; render(); break;
    case "toggle-edit": ui.editPlan = !ui.editPlan; render(); break;
    case "plan-rm": state.plan.days[+b.dataset.d].exercises.splice(+b.dataset.x, 1); savePlan(); render(); break;
    case "plan-add": { const d = state.plan.days[+b.dataset.d]; const v = document.getElementById("plan-add-" + b.dataset.d).value.trim(); if (!v) break;
      const info = exInfo(v), g = GOALS[state.profile.goal] || GOALS.general; const [sets, lo, hi, rest] = info.kind === "t" ? [3, 30, 60, 60] : g.acc;
      d.exercises.push({ name: LIB_BY_NAME.get(v.toLowerCase())?.name || v, sets, repLow: lo, repHigh: hi, rest }); d.focus = focusOf(d.exercises); savePlan(); render(); break; }
    case "ai-plan": aiPlan(); break;
    case "ai-session": aiSession(); break;
    case "tick": { const ex = A.exercises[+b.dataset.ex], s = ex.sets[+b.dataset.set];
      if (!s.done && !(+s.r > 0)) { toast("Enter your reps first"); document.getElementById(`r-${b.dataset.ex}-${b.dataset.set}`)?.focus(); break; }
      s.done = !s.done; saveActive();
      if (s.done) startRest(ex.target.rest);
      render(); break; }
    case "add-set": { const ex = A.exercises[+b.dataset.ex]; const l = ex.sets[ex.sets.length - 1] || { w: null, r: ex.target.repLow }; ex.sets.push({ w: l.w, r: l.r, rpe: "", done: false }); saveActive(0); render(); break; }
    case "rm-set": { const ex = A.exercises[+b.dataset.ex]; if (ex.sets.length > 1) ex.sets.pop(); saveActive(0); render(); break; }
    case "rm-ex": A.exercises.splice(+b.dataset.ex, 1); saveActive(0); render(); break;
    case "add-ex": { const v = document.getElementById("add-ex").value.trim(); if (!v) break; const info = exInfo(v); const g = GOALS[state.profile.goal] || GOALS.general;
      const [sets, lo, hi, rest] = info.kind === "t" ? [3, 30, 60, 60] : g.acc; const name = LIB_BY_NAME.get(v.toLowerCase())?.name || v;
      const s = suggest({ name, sets, repLow: lo, repHigh: hi });
      A.exercises.push({ name, target: { sets, repLow: lo, repHigh: hi, rest }, tip: s.note, note: "", sets: Array.from({ length: sets }, () => ({ w: s.weight, r: s.reps || lo, rpe: "", done: false })) });
      saveActive(0); render(); break; }
    case "finish": finishWorkout(); break;
    case "discard": ui.confirm = "discard"; render(); break;
    case "discard-yes": state.active = null; rest = null; ui.confirm = null; saveActive(0); render(); toast("Workout discarded"); break;
    case "rest-add": if (rest) { rest.end += 15000; rest.total += 15; rest.buzzed = false; renderRest(); } break;
    case "rest-skip": rest = null; renderRest(); break;
    case "cancel": ui.confirm = null; render(); break;
    case "del": ui.confirm = "del-" + b.dataset.id; render(); break;
    case "del-yes": deleteWorkout(b.dataset.id); ui.confirm = null; render(); toast("Workout deleted"); break;
    case "send": sendCoach(); break;
    case "suggest": askCoach(b.dataset.q); break;
    case "clear-chat": ui.confirm = "clear-chat"; render(); break;
    case "clear-chat-yes": state.chat = []; ui.confirm = null; saveChat(); render(); break;
    case "export": doExport(); break;
    case "goto-key": setTab("profile"); requestAnimationFrame(() => document.getElementById("ai-key-card")?.scrollIntoView({ block: "center" })); break;
    case "key-save": { const v = document.getElementById("api-key").value.trim();
      if (!/^sk-ant-/.test(v)) { toast("That doesn't look like an Anthropic API key (sk-ant-…)"); break; }
      try { localStorage.setItem(API_KEY_LS, v); } catch { toast("Couldn't save the key on this device"); break; }
      sample = makeApiSample(); state.ai = true; render(); toast("AI coach connected"); break; }
    case "key-remove": try { localStorage.removeItem(API_KEY_LS); } catch {} sample = null; state.ai = false; render(); toast("Key removed"); break;
    case "install": if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case "hide-install": try { localStorage.setItem("spotter.hideInstall", "1"); } catch {} render(); break;
    case "reset": ui.confirm = "reset"; render(); break;
    case "reset-yes": resetAll(); break;
  }
});

boot();
</script>
